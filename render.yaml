services:
  - type: web
    name: shl-assessment-agent
    env: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install wheel setuptools
      pip install --only-binary=:all: -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
